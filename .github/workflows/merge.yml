name: Merge CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mission-report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run two-stage ascent mission
        run: uv run topt run --scenario scenarios/two_stage_ascent.yaml

      - name: Generate HTML report
        run: uv run topt report --scenario two_stage_ascent --output two_stage_ascent

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site
          cp README.md site/index.md
          cp output/two_stage_ascent.html site/two_stage_ascent.html

      - name: Build GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}